# Plenair op GitHub: elke 15 minuten nieuws en moties ophalen en de site publiceren.
# Je API-sleutel staat als geheim (secret) ANTHROPIC_API_KEY in de repository-instellingen.
# De database wordt bewaard op een aparte branch "data".
name: Site bijwerken

on:
  schedule:
    - cron: "*/15 * * * *"   # GitHub start dit soms een paar minuten later
  workflow_dispatch:          # handmatig starten via de knop "Run workflow"
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: plenair
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      PLENAIR_DB: ${{ github.workspace }}/site.db
      PLENAIR_HOME: ${{ github.workspace }}/.plenair
    steps:
      - uses: actions/checkout@v7

      - name: Veiligheidscheck (geen sleutel in de bestanden)
        run: |
          if grep -rIl "sk-ant-[A-Za-z0-9_-]\{20,\}" --exclude-dir=.git . ; then
            echo "::error::Er staat een API-sleutel in de bestanden hierboven. Verwijder dat bestand, maak in console.anthropic.com een nieuwe sleutel en zet die alleen als secret ANTHROPIC_API_KEY."
            exit 1
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Onderdelen installeren
        run: pip install -r requirements.txt

      - name: Database ophalen
        run: |
          if git fetch --depth 1 origin data 2>/dev/null; then
            git show origin/data:site.db > site.db && echo "Bestaande database gebruikt."
          else
            echo "Nog geen database: dit is de eerste run."
          fi

      - name: Moties ophalen
        continue-on-error: true
        run: |
          if [ -s site.db ]; then python -m app.kamerbot --days 7; else python -m app.kamerbot --days 30; fi

      - name: Nieuws ophalen en samenvatten
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::Geen secret ANTHROPIC_API_KEY ingesteld: nieuws wordt overgeslagen."
          else
            python -m app.newsbot
          fi

      - name: Site maken
        env:
          PLENAIR_BASE_PATH: /${{ github.event.repository.name }}
        run: python -m app.export public

      - name: Database bewaren
        if: always()
        run: |
          [ -s site.db ] || exit 0
          python -c "import sqlite3; c=sqlite3.connect('site.db'); c.execute('PRAGMA wal_checkpoint(TRUNCATE)'); c.close()"
          mkdir -p /tmp/data && cp site.db /tmp/data/ && cd /tmp/data
          git init -q -b data
          git config user.name "plenair-bot"
          git config user.email "plenair-bot@users.noreply.github.com"
          git add site.db
          git commit -q -m "Database bijgewerkt"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - id: deploy
        uses: actions/deploy-pages@v5
